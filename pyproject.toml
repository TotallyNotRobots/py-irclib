[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "py-irclib"
dynamic = ["version"]
description = "A simple library for working with the IRC protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "linuxdaemon", email = "linuxdaemon.irc@gmail.com" }]
keywords = ["irc", "irc-parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = ["attrs>=20.3.0", "typing_extensions>=4.5.0"]

[project.urls]
Homepage = "https://github.com/TotallyNotRobots/py-irclib"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.hatch.build.targets.wheel]
packages = ["irclib"]

[tool.hatch.build.hooks.vcs]
version-file = "irclib/_version.py"

[tool.hatch.envs.default]
dependencies = [
    "coverage[toml]==7.16.2",
    "pytest==9.2.0",
    "irc-parser-tests==0.0.4",
    "pre-commit==4.7.0",
    "basedpyright==1.40.2",
    "ruamel.yaml==0.19.1",
]
post-install-commands = ["hatch run pre-commit:install"]

[tool.hatch.envs.default.scripts]
fix-pre-commit = ["hatch run python3 -m scripts.fix_pre_commit"]

[tool.hatch.envs.pre-commit]
post-install-commands = []
extra-dependencies = ["pre-commit==4.7.0"]

[tool.hatch.envs.pre-commit.scripts]
run = ["pre-commit run {args:--all}"]
install = ["pre-commit install {args:-f}"]
update = ["pre-commit autoupdate --freeze"]

[tool.hatch.envs.hatch-test]
default-args = ["tests", "irclib"]
extra-args = ["-vv", "--junitxml=junit.xml"]
extra-dependencies = [
    "coverage[toml]==7.16.2",
    "pytest==9.2.0",
    "irc-parser-tests==0.0.4",
]
post-install-commands = []

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"
run-cov = "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}"
cov-combine = "coverage combine"
cov-report = ["coverage report --show-missing --skip-covered", "coverage xml"]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.15", "3.14", "3.13", "3.12", "3.11", "3.10"]

[tool.hatch.envs.types]
extra-dependencies = ["basedpyright==1.40.2"]
post-install-commands = []

[tool.hatch.envs.types.scripts]
check = "basedpyright {args:irclib tests}"

[tool.ruff]
line-length = 80
target-version = 'py310'

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-safe-fixes = [
    "EM101",
    "UP",
    "RUF005",
    "EM102",
    "EM103",
    "FLY002",
    "TC001",
    "TC002",
    "TRY400",
    "SIM117",
    "SIM108",
    "ANN201",
    "D415",
    "D200",
]
ignore = ["TRY003", "PLW1641", "COM812", "ISC001", "EXE002", "CPY001"]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "PLR2004", # Allow "magic values" in tests -aspen
    "S101", # Allow asserts in tests
    "SIM201", # We need to test weird comparison operators
    "SIM202", # We need to test weird comparison operstors
    "SIM300", # We need to test both forward and reverse comparisons
    "FBT001", # Boolean parameters are fine for test cases
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.flynt]
aggressive = true
transform-joins = true
transform-concats = true
line-length = 120

[tool.pytest]
minversion = "9.0"
addopts = ["--doctest-modules"]
testpaths = ["irclib", "tests"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
relative_files = true

[tool.nitpick]
style = [
    "gh://TotallyNotRobots/nitpick/lib-style-3.10.toml",
    "gh://TotallyNotRobots/nitpick/styles/hatch/common.toml",
]

[tool.check-spdx-header]
headers = ["2017-present linuxdaemon <linuxdaemon.irc@gmail.com>"]

[tool.autoflake]
remove-all-unused-imports = true
in-place = true

[tool.basedpyright]
analyzeUnannotatedFunctions = true
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportImportCycles = "none"
pythonVersion = "3.10"
